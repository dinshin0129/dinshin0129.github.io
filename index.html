<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <script src="https://unpkg.com/vue@3"></script>
        <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
        <link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css">
        <script src="https://unpkg.com/element-plus"></script>
        <title>弥生古墳時代の日本史</title>
    </head>
    <body>
        <div id="app">
            <el-container>
                <el-header>
                    <el-button>{{message}}</el-button>
                </el-header>
                <el-container>
                    <el-aside>
                        <el-timeline>
                            <el-timeline-item
                                v-for="(activity, index) in activities"
                                :key="index"
                                :type="activity.type"
                                :timestamp="activity.timestamp"
                            >
                            {{activity.content}}
                        </el-timeline-item>
                        </el-timeline>
                    </el-aside>
                    <el-main>
                    </el-main>
                </el-container>
            </el-container>
        </div>
        <script>
            const app = Vue.createApp({
                data() {
                    return {
                        message: "弥生時代Loading中",
                        activities: [
                            {
                                content: '弥生時代早期'
                                timestamp: '2018-01-01'
                                type: 'primary'
                            },
                            {
                                content: '弥生時代前期'
                                timestamp: '前550~前250年'
                                type: 'primary'
                            },
                            {
                                content: '弥生時代中期'
                                timestamp: '前250~50年'
                                type: 'primary'
                            },
                            {
                                content: '弥生時代後期'
                                timestamp: '50~200年'
                                type: 'primary'
                            },
                            {
                                content: '古墳時代早期'
                                timestamp: '200~250年'
                                type: 'primary'
                            },
                            {
                                content: '古墳時代前期'
                                timestamp: '250~400年'
                                type: 'primary'
                            },
                            {
                                content: '古墳時代中期'
                                timestamp: '400~500年'
                                type: 'primary'
                            },
                            {
                                content: '古墳時代後期'
                                timestamp: '500~600年'
                                type: 'primary'
                            }
                        ]
                    };
                }
            });
            app.use(ElementPlus);
            app.mount("#app");
        </script>
    </body>
</html>
